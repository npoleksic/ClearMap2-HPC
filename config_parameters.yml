# PATHS
experiment_path: '/home/npoleksic/LSS/ncb-core/users/npoleksic/FT1' # absolute path to the experimental data folder
raw_data_path: 'lightsheet_scan/cfos_<Z,4>.tif' # relative path to the raw data from the experimental data folder
autof_data_path: 'lightsheet_scan/autof_<Z,4>.tif' # relative path to autofluorescence data from the experimental data folder 
file_type: 'tiff_folder' # 'npy', 'tiff', or 'tiff_folder'
# NOTE: generalize image file names with tag (i.e. Z<Z,4> instead of Z0001, Z0002, etc.)

save_crop: false
save_preprocessing: false
skip_registration: false
skip_detection: false
auto_thresh: true

# RESOLUTION
raw_x_resolution: 2.1667 #resolution of the raw data in the x-direction
raw_y_resolution: 2.1667 # resolution of the raw data in the y-direction
raw_z_resolution: 2 # resolution of the raw data in the z-direction
autof_x_resolution: 2.1667 # resolution of the autofluorescence data in the x-direction
autof_y_resolution: 2.1667 # resolution of the autofluorescence data in the y-direction
autof_z_resolution: 2 # resolution of the autofluorescence data in the z-direction

# ATLAS SETUP
# NOTE: to improve performance, ensure the following parameters closely align with the experimental data
x_orientation: 3 # atlas axis that matches experimental data x-axis
y_orientation: -2 # atlas axis that matches experimental data y-axis
z_orientation: 1 # atlas axis that matches experimental data z-axis
# NOTE: orientations should be expressed as a 1, 2, or 3 corresponding to axes x, y, and z

# CROPPING
raw_x_min: 0 # minimum crop in x-direction 
raw_x_max: 'MAX' # maximum crop in x-direction
raw_y_min: 0 # minimum crop in y-direction
raw_y_max: 'MAX' # maximum crop in y-direction
raw_z_min: 0 # minimum crop in z-direction
raw_z_max: 'MAX' # maximum crop in z-direction

crop_match: true

auto_x_min: 0 # minimum crop in x-direction 
auto_x_max: 'MAX' # maximum crop in x-direction
auto_y_min: 0 # minimum crop in y-direction
auto_y_max: 'MAX' # maximum crop in y-direction
auto_z_min: 0 # minimum crop in z-direction
auto_z_max: 'MAX' # maximum crop in z-direction

atlas_x_min: 0 # minimum crop in x-direction (after atlas-matching)
atlas_x_max: 'MAX' # maximum crop in x-direction
atlas_y_min: 0 # minimum crop in y-direction
atlas_y_max: 'MAX' # maximum crop in y-direction
atlas_z_min: 0 # minimum crop in z-direction
atlas_z_max: 'MAX' # maximum crop in z-direction

# CELL DETECTION PARAMETERS -> CHECK ClearMap/ImageProcessing/Cells.py @detect_cells for documentation 
# For detecting peak pixel values of cells pre-processed image
maxima_detection_shape: 7 # int or false
maxima_detection_threshold: 120 # float or false
maxima_detection_save: false # true or false

# Shape of cells
shape_detection_threshold: 100 # float or false
shape_detection_save: false # true or false

# Intensity of detected cells (Only affects post-detection filtering)
intensity_detection_method: 'max' # 'max', 'min', 'mean', 'sum', or false
intensity_detection_shape: 7 # int or false

# MISC
filter_size_min: 10 # minimum cell size to be counted
filter_size_max: "MAX" # maximum cell size to be counted
filter_intensity_min: 0 # minimum cell intensity to be counted
filter_intensity_max: "MAX" # maximum cell intensity to be counted
filter_distance_min: 5 # minimum pixel distance cells should be from each other
include_checkpoints: false # check progress during execution